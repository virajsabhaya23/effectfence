name: effectfence-live

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: effectfence
      POSTGRES_USER: effectfence
      POSTGRES_PASSWORD: effectfence-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effectfence -d effectfence"]
      interval: 3s
      timeout: 3s
      retries: 20
