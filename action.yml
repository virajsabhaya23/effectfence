name: SafeSink MCP Conformance
description: Verify MCP tool effect declarations against observed state changes (formerly EffectFence)
author: Viraj Sabhaya
branding:
  icon: shield
  color: blue
inputs:
  manifest:
    description: Path to an effectfence.mcp.v1 manifest (kept for compat, also safesink.mcp.v1)
    required: true
  out:
    description: JSON report path
    required: false
    default: safesink-mcp-report.json
  junit:
    description: JUnit report path
    required: false
    default: safesink-mcp-junit.xml
  sarif:
    description: SARIF report path
    required: false
    default: safesink-mcp.sarif
outputs:
  report:
    description: JSON report path
    value: ${{ inputs.out }}
runs:
  using: composite
  steps:
    - name: Install SafeSink
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Verify MCP conformance
      shell: bash
      env:
        SAFESINK_MANIFEST: ${{ inputs.manifest }}
        SAFESINK_OUT: ${{ inputs.out }}
        SAFESINK_JUNIT: ${{ inputs.junit }}
        SAFESINK_SARIF: ${{ inputs.sarif }}
      run: >-
        python -m safesink mcp-verify "$SAFESINK_MANIFEST"
        --out "$SAFESINK_OUT"
        --junit "$SAFESINK_JUNIT"
        --sarif "$SAFESINK_SARIF"
