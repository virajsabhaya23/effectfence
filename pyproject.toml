[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effectfence"
version = "0.1.0"
description = "Crash/retry side-effect safety verifier"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Viraj Sabhaya"}]

[project.urls]
Homepage = "https://github.com/virajsabhaya23/effectfence"
Repository = "https://github.com/virajsabhaya23/effectfence"
Issues = "https://github.com/virajsabhaya23/effectfence/issues"

[project.scripts]
effectfence = "effectfence.cli:main"

[tool.setuptools.packages.find]
include = ["effectfence*"]
