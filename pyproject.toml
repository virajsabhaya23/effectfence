[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "safesink"
version = "0.4.4"
description = "MCP tool side-effect conformance verifier (formerly EffectFence)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Viraj Sabhaya"}]
keywords = ["mcp", "model-context-protocol", "conformance", "side-effects", "idempotency", "safesink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3.4,<4"]
mysql = ["pymysql>=1.1,<2"]
live-kafka-postgres = [
    "confluent-kafka>=2.15.0,<3",
    "psycopg[binary]>=3.3.4,<4",
]

[project.urls]
Homepage = "https://github.com/virajsabhaya23/effectfence"
Repository = "https://github.com/virajsabhaya23/effectfence"
Issues = "https://github.com/virajsabhaya23/effectfence/issues"
Documentation = "https://github.com/virajsabhaya23/effectfence/tree/main/docs"
Changelog = "https://github.com/virajsabhaya23/effectfence/blob/main/CHANGELOG.md"

[project.scripts]
safesink = "safesink.cli:main"
safesink-mcp = "safesink.mcp_server:main"
safesink-legacy = "safesink.legacy.cli:main"
effectfence = "effectfence.cli:main"
