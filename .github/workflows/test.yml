name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Format hygiene
        run: python scripts/format_check.py
      - name: Syntax lint
        run: python scripts/lint.py
      - name: Type interface check
        run: python scripts/typecheck.py
      - name: Compile
        run: python -m compileall -q effectfence tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark corpus (30 cases)
        run: python -m effectfence benchmark benchmark/corpus.json --out benchmark/results.json
      - name: Keep benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark/results.json
          if-no-files-found: warn
          retention-days: 14
