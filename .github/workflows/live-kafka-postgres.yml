name: live-kafka-postgres

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-kafka-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  killpoint-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 20s
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: effectfence
          POSTGRES_USER: effectfence
          POSTGRES_PASSWORD: effectfence-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U effectfence -d effectfence"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      EFFECTFENCE_POSTGRES_DSN: postgresql://effectfence:effectfence-ci-only@127.0.0.1:5432/effectfence
      EFFECTFENCE_KAFKA_BOOTSTRAP: 127.0.0.1:9092

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[live-kafka-postgres]"
      - name: Verify EffectFence stable identity
        run: >-
          effectfence live-kafka-postgres
          --strategy effectfence
          --expect safe
          --run-id ci-safe
          --broker-version-label apache/kafka:4.3.1
          --timeout 120
      - name: Prove the naive retry control duplicates the effect
        run: >-
          effectfence live-kafka-postgres
          --strategy naive
          --expect unsafe
          --run-id ci-naive-control
          --broker-version-label apache/kafka:4.3.1
          --timeout 120
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effectfence-live-evidence
          path: out/live/
          if-no-files-found: error
          retention-days: 30
