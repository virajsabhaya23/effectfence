name: pip-audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pypa/gh-action-pip-audit@v1.0.8
        with:
          inputs: |
            .
          # only the base package has no deps, but this still catches
          # workflow/pip cache issues if requirements ever grow
